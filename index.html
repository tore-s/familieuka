<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familieuka</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#18233A; --muted:#5B6578; --line:#D5DBE3;
  --accent:#1F6F4A; --accent-ink:#FFFFFF; --today:#FFF6D6; --danger:#B4232F;
  --shadow:0 1px 2px rgba(24,35,58,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --surface:#1B2330; --ink:#E8EDF4; --muted:#9AA6B8; --line:#2C3747;
    --accent:#4CC08A; --accent-ink:#0E1A14; --today:#2B2A1C; --danger:#F06C76; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1B2330; --ink:#E8EDF4; --muted:#9AA6B8; --line:#2C3747;
  --accent:#4CC08A; --accent-ink:#0E1A14; --today:#2B2A1C; --danger:#F06C76; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px 6px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:0;margin-right:auto}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav .wk{font-weight:700;min-width:7.5em;text-align:center}
.weeknav .wk small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;padding:0 10px}
.tabs{display:flex;gap:6px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}

main{padding:14px 16px 100px;max-width:1500px;margin:0 auto}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid #E2A21B;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.viewhead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.viewhead h2{margin:0;font-size:1.25rem}
.viewhead p{margin:0;color:var(--muted);font-size:.9rem}

.week{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:960px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:120px;box-shadow:var(--shadow);overflow:hidden}
.day.today{background:var(--today);border-color:var(--accent)}
.dayhead{display:flex;align-items:center;gap:8px;padding:8px 8px 6px 12px}
.dayhead .num{font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.day.today .num{color:var(--accent)}
.dayhead .nm{font-size:.85rem;color:var(--muted);line-height:1.1}
.dayhead .nm b{display:block;color:var(--ink);font-weight:700}
.dayhead .add{margin-left:auto;border:none;background:transparent;border-radius:8px;width:34px;height:34px;font-size:1.3rem;color:var(--muted)}
.dayhead .add:hover{background:var(--bg);color:var(--ink)}
.events{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;flex:1}
.empty{color:var(--muted);font-size:.85rem;padding:2px 4px}
.ev{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px 6px 10px;border-left:5px solid var(--c,var(--ink));width:100%;display:block}
.day.today .ev{background:var(--surface)}
.ev:hover{border-color:var(--muted)}
.ev .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .ti{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.ev .meta{font-size:.8rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.who{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.who span{font-size:.7rem;font-weight:700;color:#fff;border-radius:999px;padding:0 7px;line-height:1.6}
.who .all{background:var(--ink);color:var(--bg)}
.dinner{border-top:1px dashed var(--line);padding:7px 12px;font-size:.9rem;display:flex;gap:6px;align-items:baseline}
.dinner .lbl{color:var(--muted);flex:none}
.dinner b{overflow-wrap:anywhere}

.meals{display:flex;flex-direction:column;gap:8px;max-width:760px}
.meal{display:grid;grid-template-columns:5.5em 1fr;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meal.today{background:var(--today);border-color:var(--accent)}
.meal .d b{display:block;font-size:1.05rem}
.meal .d span{color:var(--muted);font-size:.85rem}
.meal .f{display:grid;grid-template-columns:1fr 9.5em;gap:8px}
@media (max-width:560px){.meal{grid-template-columns:1fr}.meal .f{grid-template-columns:1fr}}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px}
textarea{min-height:70px;resize:vertical}
.mealtools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:none;border-radius:16px;padding:14px 20px;font-weight:700;font-size:1rem;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:6}

dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,15,25,.5)}
.dlg{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:1.25rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media (max-width:480px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f>*{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600}
.chip input:checked+span{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 18%,transparent)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:20px;height:20px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.actions .danger{margin-right:auto}
.memrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.memrow input[type=color]{width:44px;height:42px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.login p{margin:0;color:var(--muted);font-size:.9rem}
.login .err{color:var(--danger)}
input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.ev,.tab,.btn{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Familieuka</h1>
    <div class="weeknav">
      <button class="iconbtn" id="prev" aria-label="Forrige uke">‹</button>
      <div class="wk" id="wklabel" aria-live="polite"></div>
      <button class="iconbtn" id="next" aria-label="Neste uke">›</button>
      <button class="iconbtn" id="todayBtn">I dag</button>
      <button class="iconbtn" id="settingsBtn" aria-label="Familiemedlemmer">⚙︎</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Visning"></nav>
</header>

<main id="main"></main>
<button class="fab" id="fab">+ Ny aktivitet</button>

<dialog id="evDlg" aria-labelledby="evTitle">
  <form class="dlg" id="evForm" method="dialog">
    <h3 id="evTitle">Ny aktivitet</h3>
    <div class="row">
      <label class="f">Hva
        <input type="text" name="title" required placeholder="Fotballtrening" autocomplete="off">
      </label>
      <label class="f">Type
        <select name="cat">
          <option value="⚽">⚽ Trening</option>
          <option value="🏆">🏆 Kamp / cup</option>
          <option value="🎵">🎵 Musikk / kultur</option>
          <option value="📚">📚 Skole</option>
          <option value="🩺">🩺 Lege / tannlege</option>
          <option value="🎉">🎉 Bursdag / sosialt</option>
          <option value="💼">💼 Jobb</option>
          <option value="📌">📌 Annet</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="f">Fra dato <input type="date" name="date" required></label>
      <label class="f">Til dato <input type="date" name="endDate"></label>
    </div>
    <label class="check"><input type="checkbox" name="allDay"> Hele dagen</label>
    <div class="row" id="timeRow">
      <label class="f">Fra kl. <input type="time" name="start"></label>
      <label class="f">Til kl. <input type="time" name="end"></label>
    </div>
    <div>
      <div style="font-size:.85rem;color:var(--muted);margin-bottom:6px">Hvem gjelder det? (ingen valgt = hele familien)</div>
      <div class="chips" id="whoChips"></div>
    </div>
    <div class="row">
      <label class="f">Sted <input type="text" name="place" placeholder="Kunstgresset" autocomplete="off"></label>
      <label class="f">Hvem kjører <input type="text" name="driver" list="memberList" autocomplete="off"></label>
    </div>
    <datalist id="memberList"></datalist>
    <label class="check"><input type="checkbox" name="repeat"> Gjentas hver uke</label>
    <label class="f" id="untilWrap" hidden>Til og med dato <input type="date" name="until"></label>
    <label class="f">Notat <textarea name="note" placeholder="Ta med drikkeflaske og leggskinn"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>Slett</button>
      <button type="button" class="btn" id="cancelBtn">Avbryt</button>
      <button type="submit" class="btn primary">Lagre</button>
    </div>
  </form>
</dialog>

<dialog id="memDlg" aria-labelledby="memTitle">
  <form class="dlg" id="memForm" method="dialog">
    <h3 id="memTitle">Familiemedlemmer</h3>
    <p style="margin:0;color:var(--muted);font-size:.9rem">Navn og farge brukes i hele oversikten. La et navn stå tomt for å fjerne personen.</p>
    <div id="memRows" style="display:flex;flex-direction:column;gap:8px"></div>
    <button type="button" class="btn" id="addMem">Legg til person</button>
    <div class="actions">
      <button type="button" class="btn danger" id="logoutBtn">Logg ut på denne enheten</button>
      <button type="button" class="btn" id="memCancel">Avbryt</button>
      <button type="submit" class="btn primary">Lagre</button>
    </div>
  </form>
</dialog>

<div class="login" id="login" hidden>
  <form id="loginForm">
    <h2>Familieuka</h2>
    <p id="loginMsg">Logg inn med familiekontoen. Du trenger bare å gjøre dette én gang på hver enhet.</p>
    <label class="f">E-post <input type="email" name="email" autocomplete="username" required></label>
    <label class="f">Passord <input type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button type="submit" class="btn primary">Logg inn</button>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const DEFAULT_MEMBERS = [
    {id:"m1", name:"Tore",    color:"#2F6FDE"},
    {id:"m2", name:"Jannicke", color:"#C23B7A"},
    {id:"m3", name:"Oliver",  color:"#2E9E5B"},
    {id:"m4", name:"Emil",    color:"#D98A0B"},
    {id:"m5", name:"Ulrik",   color:"#7C4DDB"}
  ];
  const DAYS = ["mandag","tirsdag","onsdag","torsdag","fredag","lørdag","søndag"];
  const MONTHS = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
  
  const state = { members: DEFAULT_MEMBERS.slice(), events: {}, meals: {} };
  let view = "felles";
  let weekStart = mondayOf(new Date());
  let backend = "loading";
  let db = null;
  let readOnly = false;
  let pendingRender = false;
  let editingId = null;

  const $ = s => document.querySelector(s);
  const main = $("#main");

  // ---------- dato-hjelpere ----------
  function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseIso(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  function weekNo(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
  function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  const todayIso = () => iso(new Date());

  // ---------- lagring (Supabase) ----------
  const SUPABASE_URL = "https://eshllpamzfbvlofyhijh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gDXTHxlEPhxzRX3ClwOXiQ_5_ghEQKc";

  let sb = null;
  let channel = null;

  function writeFailed(e){
    console.error(e);
    if(e && (e.status===401 || e.code==="42501")) toast("Du er logget ut. Logg inn igjen.");
    else toast("Fikk ikke lagret. Sjekk nettforbindelsen og prøv igjen.");
  }
  async function upsert(kind,id,data){
    const { error } = await sb.from("items").upsert({ kind, id, data, updated_at: new Date().toISOString() });
    if(error) writeFailed(error);
  }
  async function remove(kind,id){
    const { error } = await sb.from("items").delete().match({ kind, id });
    if(error) writeFailed(error);
  }
  async function putEvent(id,data){ state.events[id]=data; render(); await upsert("event",id,data); }
  async function removeEvent(id){ delete state.events[id]; render(); await remove("event",id); }
  async function putMeal(date,data){
    const empty=!data.dish && !data.cook;
    if(empty){ delete state.meals[date]; await remove("meal",date); }
    else { state.meals[date]=data; await upsert("meal",date,data); }
  }
  async function putMembers(members){ state.members=members; render(); await upsert("config","family",{members}); }

  function applyRow(row, deleted){
    if(!row || !row.kind) return;
    if(row.kind==="event"){ if(deleted) delete state.events[row.id]; else state.events[row.id]=row.data; }
    else if(row.kind==="meal"){ if(deleted) delete state.meals[row.id]; else state.meals[row.id]=row.data; }
    else if(row.kind==="config" && row.id==="family" && !deleted && row.data && Array.isArray(row.data.members) && row.data.members.length) state.members=row.data.members;
  }
  async function loadAll(){
    const { data, error } = await sb.from("items").select("kind,id,data");
    if(error){ writeFailed(error); return; }
    state.events={}; state.meals={};
    data.forEach(r=>applyRow(r,false));
    render();
  }
  function subscribe(){
    if(channel) sb.removeChannel(channel);
    channel = sb.channel("familieuka")
      .on("postgres_changes", { event:"*", schema:"public", table:"items" }, p=>{
        if(p.eventType==="DELETE") applyRow(p.old,true); else applyRow(p.new,false);
        render();
      })
      .subscribe();
  }
  async function startData(){
    $("#login").hidden=true;
    backend="db";
    await loadAll();
    subscribe();
  }
  function showLogin(msg){
    $("#login").hidden=false;
    if(msg) $("#loginErr").textContent=msg;
  }

  async function connect(){
    if(SUPABASE_URL.startsWith("LIM_INN")){
      showLogin("Appen er ikke koblet til Supabase ennå. Fyll inn SUPABASE_URL og SUPABASE_KEY i index.html.");
      $("#loginForm").querySelector("button").disabled=true;
      return;
    }
    if(!window.supabase){
      showLogin("Fikk ikke lastet inn Supabase-biblioteket. Sjekk nettforbindelsen, og slå av eventuell annonseblokkering for denne siden.");
      $("#loginForm").querySelector("button").disabled=true;
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data:{ session } } = await sb.auth.getSession();
    if(session) startData(); else showLogin();
    sb.auth.onAuthStateChange((event, session)=>{
      if(event==="SIGNED_OUT"){ if(channel) sb.removeChannel(channel); channel=null; showLogin(); }
    });
  }

  $("#loginForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const f=e.target, btn=f.querySelector("button");
    $("#loginErr").textContent=""; btn.disabled=true; btn.textContent="Logger inn…";
    const { error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.password.value });
    btn.disabled=false; btn.textContent="Logg inn";
    if(error){ $("#loginErr").textContent="Feil e-post eller passord."; return; }
    f.password.value="";
    startData();
  });
  $("#logoutBtn").addEventListener("click", async ()=>{
    if(!confirm("Logge ut på denne enheten?")) return;
    $("#memDlg").close();
    await sb.auth.signOut();
  });
  // Hent på nytt når nettbrettet/mobilen våkner, i tilfelle noe ble endret mens den sov
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && sb && backend==="db"){ loadAll(); subscribe(); } });

  // ---------- logikk ----------
  const memberById = id => state.members.find(m=>m.id===id);
  const dayDiff = (a,b) => Math.round((parseIso(b)-parseIso(a))/864e5);
  function eventsOn(dateStr){
    const out=[];
    for(const [id,e] of Object.entries(state.events)){
      if(!e || !e.date) continue;
      const span=Math.max(0, e.endDate ? dayDiff(e.date,e.endDate) : 0);
      // Finn en forekomst som starter k dager før dateStr
      for(let k=0;k<=span;k++){
        const startStr=iso(addDays(parseIso(dateStr),-k));
        if(startStr<e.date) continue;
        const ok = startStr===e.date || (e.repeat && (!e.until || startStr<=e.until) && dayDiff(e.date,startStr)%7===0);
        if(ok){ out.push({id,...e,_k:k,_span:span}); break; }
      }
    }
    const key = e => (e.allDay || (e._k>0)) ? "" : (e.start||"");
    return out.sort((a,b)=>key(a).localeCompare(key(b)));
  }
  function timeLabel(e){
    const n=e._span+1, part = n>1 ? ` · dag ${e._k+1} av ${n}` : "";
    if(e.allDay || !e.start) return "Hele dagen"+part;
    if(n===1) return esc(e.start)+(e.end?"–"+esc(e.end):"");
    if(e._k===0) return "Fra "+esc(e.start)+part;
    if(e._k===e._span) return (e.end?"Til "+esc(e.end):"Hele dagen")+part;
    return "Hele dagen"+part;
  }
  function involves(e,mid){ return !e.who || !e.who.length || e.who.includes(mid); }

  // ---------- visning ----------
  function render(){
    if(main.contains(document.activeElement) && document.activeElement.matches("input,select,textarea")){ pendingRender=true; return; }
    pendingRender=false;
    renderHeader(); renderTabs();
    $("#fab").hidden = readOnly;
    if(view==="middag") renderMeals(); else renderWeek(view==="felles"?null:view);
  }
  function renderHeader(){
    const end=addDays(weekStart,6);
    const sameMonth=weekStart.getMonth()===end.getMonth();
    $("#wklabel").innerHTML = "Uke "+weekNo(weekStart)+"<small>"+weekStart.getDate()+(sameMonth?"":". "+MONTHS[weekStart.getMonth()])+"–"+end.getDate()+". "+MONTHS[end.getMonth()]+"</small>";
  }
  function renderTabs(){
    if(view!=="felles" && view!=="middag" && !memberById(view)) view="felles";
    const items=[{id:"felles",label:"Felles"},...state.members.map(m=>({id:m.id,label:m.name,color:m.color})),{id:"middag",label:"Middag"}];
    $("#tabs").innerHTML = items.map(t=>`<button class="tab" role="tab" data-view="${esc(t.id)}" aria-selected="${t.id===view}">${t.color?`<span class="dot" style="background:${esc(t.color)}"></span>`:""}${esc(t.label)}</button>`).join("");
  }
  function notice(){
        if(readOnly) return `<div class="notice">Du kan se oversikten, men ikke endre den.</div>`;
    return "";
  }
  function whoTags(e){
    if(!e.who || !e.who.length) return `<span class="all">Alle</span>`;
    return e.who.map(id=>{ const m=memberById(id); return m?`<span style="background:${esc(m.color)}">${esc(m.name)}</span>`:""; }).join("");
  }
  function renderWeek(mid){
    const m = mid?memberById(mid):null;
    let html=notice();
    let total=0;
    const days=[...Array(7)].map((_,i)=>{
      const d=addDays(weekStart,i), ds=iso(d);
      let evs=eventsOn(ds); if(mid) evs=evs.filter(e=>involves(e,mid));
      total+=evs.length;
      const meal=state.meals[ds];
      const isToday=ds===todayIso();
      const evHtml = evs.length ? evs.map(e=>{
        const c = (e.who && e.who.length===1 && memberById(e.who[0])) ? memberById(e.who[0]).color : "var(--ink)";
        const time = timeLabel(e);
        const meta=[e.place?"📍 "+esc(e.place):"", e.driver?"🚗 "+esc(e.driver):"", e.repeat?"↻ ukentlig":""].filter(Boolean).join("&ensp;");
        return `<button class="ev" style="--c:${esc(c)}" data-ev="${esc(e.id)}" aria-label="${esc(e.title)} ${time}"><div class="t">${time}</div><div class="ti">${esc(e.cat||"")} ${esc(e.title)}</div>${meta?`<div class="meta">${meta}</div>`:""}${e.note?`<div class="meta">${esc(e.note)}</div>`:""}<div class="who">${whoTags(e)}</div></button>`;
      }).join("") : `<div class="empty">Ingen aktiviteter</div>`;
      return `<section class="day${isToday?" today":""}" aria-label="${DAYS[i]} ${d.getDate()}. ${MONTHS[d.getMonth()]}">
        <div class="dayhead"><span class="num">${d.getDate()}</span><span class="nm"><b>${DAYS[i]}</b>${isToday?"i dag":MONTHS[d.getMonth()]}</span>${readOnly?"":`<button class="add" data-add="${ds}" aria-label="Legg til aktivitet ${DAYS[i]}">+</button>`}</div>
        <div class="events">${evHtml}</div>
        ${meal&&meal.dish?`<div class="dinner"><span class="lbl">Middag</span><b>${esc(meal.dish)}</b></div>`:""}
      </section>`;
    }).join("");
    const head = m
      ? `<div class="viewhead"><h2><span class="dot" style="background:${esc(m.color)};width:14px;height:14px"></span> ${esc(m.name)}s uke</h2><p>${total} aktiviteter, inkludert det hele familien skal på</p></div>`
      : `<div class="viewhead"><h2>Hele familien</h2><p>${total} aktiviteter denne uka</p></div>`;
    main.innerHTML = html+head+`<div class="week">${days}</div>`;
  }
  function renderMeals(){
    const opts = `<option value="">Hvem lager?</option>`+state.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
    const rows=[...Array(7)].map((_,i)=>{
      const d=addDays(weekStart,i), ds=iso(d), meal=state.meals[ds]||{};
      return `<div class="meal${ds===todayIso()?" today":""}">
        <div class="d"><b>${DAYS[i][0].toUpperCase()+DAYS[i].slice(1)}</b><span>${d.getDate()}. ${MONTHS[d.getMonth()]}</span></div>
        <div class="f">
          <input type="text" data-meal="${ds}" data-k="dish" value="${esc(meal.dish||"")}" placeholder="Hva skal vi spise?" aria-label="Middag ${DAYS[i]}" ${readOnly?"disabled":""}>
          <select data-meal="${ds}" data-k="cook" aria-label="Hvem lager middag ${DAYS[i]}" ${readOnly?"disabled":""}>${opts.replace(`value="${esc(meal.cook||"")}"`,`value="${esc(meal.cook||"")}" selected`)}</select>
        </div>
      </div>`;
    }).join("");
    main.innerHTML = notice()+`<div class="viewhead"><h2>Middagsplan</h2><p>Endringer lagres når du går ut av feltet</p></div><div class="meals">${rows}</div>`+
      (readOnly?"":`<div class="mealtools"><button class="btn" id="copyMeals">Kopier forrige ukes middager</button></div>`);
  }

  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }

  // ---------- skjema: aktivitet ----------
  const evDlg=$("#evDlg"), evForm=$("#evForm");
  function openEvent(id, date){
    if(readOnly && !id) return;
    editingId=id||null;
    const e = id ? state.events[id] : null;
    $("#evTitle").textContent = e ? "Endre aktivitet" : "Ny aktivitet";
    evForm.reset();
    evForm.title.value=e?.title||""; evForm.cat.value=e?.cat||"⚽";
    evForm.date.value=e?.date||date||todayIso();
    evForm.endDate.value=e?.endDate||"";
    evForm.allDay.checked=!!e?.allDay;
    evForm.start.value=e?.start||""; evForm.end.value=e?.end||"";
    $("#timeRow").hidden=evForm.allDay.checked;
    evForm.place.value=e?.place||""; evForm.driver.value=e?.driver||"";
    evForm.repeat.checked=!!e?.repeat; evForm.until.value=e?.until||"";
    evForm.note.value=e?.note||"";
    $("#untilWrap").hidden=!evForm.repeat.checked;
    $("#whoChips").innerHTML = state.members.map(m=>`<label class="chip" style="--c:${esc(m.color)}"><input type="checkbox" name="who" value="${esc(m.id)}" ${e?.who?.includes(m.id)?"checked":""}><span><span class="dot" style="background:${esc(m.color)}"></span>${esc(m.name)}</span></label>`).join("");
    $("#memberList").innerHTML = state.members.map(m=>`<option value="${esc(m.name)}">`).join("");
    $("#delBtn").hidden=!e || readOnly;
    [...evForm.elements].forEach(el=>{ if(el.id!=="cancelBtn") el.disabled=readOnly; });
    evDlg.showModal();
  }
  evForm.allDay.addEventListener("change",()=>$("#timeRow").hidden=evForm.allDay.checked);
  evForm.date.addEventListener("change",()=>{ if(evForm.endDate.value && evForm.endDate.value<evForm.date.value) evForm.endDate.value=evForm.date.value; });
  evForm.repeat.addEventListener("change",()=>$("#untilWrap").hidden=!evForm.repeat.checked);
  $("#cancelBtn").onclick=()=>evDlg.close();
  $("#delBtn").onclick=()=>{
    const e=state.events[editingId]; if(!e) return;
    if(!confirm(e.repeat?"Slette hele serien med \""+e.title+"\"?":"Slette \""+e.title+"\"?")) return;
    removeEvent(editingId); evDlg.close();
  };
  evForm.addEventListener("submit",ev=>{
    ev.preventDefault();
    const f=evForm;
    const data={
      title:f.title.value.trim(), cat:f.cat.value, date:f.date.value,
      endDate:(f.endDate.value && f.endDate.value>f.date.value) ? f.endDate.value : "",
      allDay:f.allDay.checked,
      start:f.allDay.checked?"":f.start.value, end:f.allDay.checked?"":f.end.value, place:f.place.value.trim(), driver:f.driver.value.trim(),
      who:[...f.querySelectorAll('input[name=who]:checked')].map(x=>x.value),
      repeat:f.repeat.checked, until:f.repeat.checked?f.until.value:"", note:f.note.value.trim()
    };
    if(!data.title || !data.date) return;
    if(f.endDate.value && f.endDate.value<f.date.value){ toast("Til-dato kan ikke være før fra-dato."); return; }
    putEvent(editingId||uid(), data);
    evDlg.close();
    const d=parseIso(data.date); if(d<weekStart || d>addDays(weekStart,6)){ weekStart=mondayOf(d); render(); }
  });

  // ---------- skjema: medlemmer ----------
  const memDlg=$("#memDlg"), memRows=$("#memRows");
  function memRow(m){ return `<div class="memrow" data-id="${esc(m.id)}"><input type="color" value="${esc(m.color)}" aria-label="Farge"><input type="text" value="${esc(m.name)}" placeholder="Navn" aria-label="Navn"></div>`; }
  $("#settingsBtn").onclick=()=>{ memRows.innerHTML=state.members.map(memRow).join(""); [...memDlg.querySelectorAll("input,button[type=submit],#addMem")].forEach(el=>el.disabled=readOnly); memDlg.showModal(); };
  $("#addMem").onclick=()=>memRows.insertAdjacentHTML("beforeend",memRow({id:"m"+uid(),name:"",color:"#3A8FB7"}));
  $("#memCancel").onclick=()=>memDlg.close();
  $("#memForm").addEventListener("submit",ev=>{
    ev.preventDefault();
    const members=[...memRows.querySelectorAll(".memrow")].map(r=>({id:r.dataset.id,color:r.querySelector("input[type=color]").value,name:r.querySelector("input[type=text]").value.trim()})).filter(m=>m.name);
    if(!members.length){ toast("Legg inn minst én person."); return; }
    putMembers(members); memDlg.close();
  });

  // ---------- hendelser ----------
  $("#prev").onclick=()=>{ weekStart=addDays(weekStart,-7); render(); };
  $("#next").onclick=()=>{ weekStart=addDays(weekStart,7); render(); };
  $("#todayBtn").onclick=()=>{ weekStart=mondayOf(new Date()); render(); const t=document.querySelector(".today"); if(t && window.innerWidth<960) t.scrollIntoView({block:"start"}); };
  $("#fab").onclick=()=>{ const t=todayIso(); const inWeek=parseIso(t)>=weekStart && parseIso(t)<=addDays(weekStart,6); openEvent(null, inWeek?t:iso(weekStart)); };
  $("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-view]"); if(b){ view=b.dataset.view; render(); } });
  main.addEventListener("click",e=>{
    const ev=e.target.closest("[data-ev]"); if(ev){ openEvent(ev.dataset.ev); return; }
    const add=e.target.closest("[data-add]"); if(add){ openEvent(null, add.dataset.add); return; }
    if(e.target.id==="copyMeals"){
      let n=0;
      for(let i=0;i<7;i++){ const from=iso(addDays(weekStart,i-7)), to=iso(addDays(weekStart,i)); if(state.meals[from] && !state.meals[to]){ putMeal(to,{...state.meals[from]}); n++; } }
      render(); toast(n?`Kopierte ${n} middager.`:"Ingen middager å kopiere til tomme dager.");
    }
  });
  main.addEventListener("change",e=>{
    const el=e.target.closest("[data-meal]"); if(!el) return;
    const ds=el.dataset.meal; const cur={dish:"",cook:"",...(state.meals[ds]||{})};
    cur[el.dataset.k]=el.value.trim(); putMeal(ds,cur);
  });
  main.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("input[data-meal]")) e.target.blur(); });
  main.addEventListener("focusout",()=>{ setTimeout(()=>{ if(pendingRender) render(); },0); });

  render();
  connect();
  // Oppdater "i dag"-markeringen rett over midnatt
  setInterval(render, 15*60*1000);
})();
</script>
</body>
</html>
